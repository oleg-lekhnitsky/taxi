<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101813" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oud Tuner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A focused Arabic oud tuner for C tuning." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Oud C Tuner</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="tuner-card" aria-label="Pitch meter">
        <div class="meter">
          <div class="ticks" aria-hidden="true">
            <i style="--x: 0"></i><i style="--x: 1"></i><i style="--x: 2"></i><i style="--x: 3"></i><i style="--x: 4"></i>
            <i style="--x: 5"></i><i style="--x: 6"></i><i style="--x: 7"></i><i style="--x: 8"></i><i style="--x: 9"></i>
            <i class="center" style="--x: 10"></i>
            <i style="--x: 11"></i><i style="--x: 12"></i><i style="--x: 13"></i><i style="--x: 14"></i><i style="--x: 15"></i>
            <i style="--x: 16"></i><i style="--x: 17"></i><i style="--x: 18"></i><i style="--x: 19"></i><i style="--x: 20"></i>
          </div>
          <div class="meter-labels"><span>-50</span><span>0</span><span>+50</span></div>
          <div class="needle" id="needle" aria-hidden="true"></div>
          <div class="meter-center" aria-hidden="true"></div>
        </div>

        <div class="readout">
          <div class="note-row">
            <span class="accidental" id="flatLabel"></span>
            <strong id="noteName">C</strong>
            <!-- <span class="octave" id="octave">2</span> -->
          </div>
          <p class="frequency"><span id="frequency">65.4</span> Hz</p>
        </div>

        <button class="listen-button" id="listenButton">
          <span id="listenLabel">Start tuning</span>
        </button>
      </section>

      <section class="courses" aria-labelledby="coursesTitle">
        <div class="section-heading">
          <div>
            
            <h2 id="coursesTitle">Arabic C tuning (Low to high)</h2>
          </div>
        </div>
        <div class="course-grid" id="courseGrid"></div>
      </section>

      <p class="install-hint" id="installHint">For a full-screen app, add Oud Tuner to your home screen.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
